# Ported business logic is C++ and leans on the STL (std::list, std::vector,
# std::sort) via stravaV10's routes/*, so we need a real C++ runtime + libc,
# not Zephyr's minimal libc.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# routes/* uses std::list/vector/sort -- Zephyr's default "minimal" C++ lib
# only provides new/delete, not the STL. This pulls in the real one (host
# libstdc++ on native_sim; newlib-based libstdc++ once we build for the DK).
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ASSERT=y

# Picolibc (the DK's default libc) drops %f/%g printf support unless asked
# for; without this, floats print as the literal string "*float*".
CONFIG_PICOLIBC_IO_FLOAT=y
