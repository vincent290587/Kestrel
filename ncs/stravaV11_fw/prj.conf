# Phase 2: DK driver bring-up. GPIO is on by default; this app also needs:
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_LOG=y

# Phase 3: sensors (bme280, fxos8700) and FRAM-equivalent settings storage.
CONFIG_SENSOR=y
CONFIG_EEPROM=y

# Phase 4: storage. SD-over-SPI disk_access (no card present, see overlay)
# and the DK's real on-board QSPI NOR flash via the direct flash API (see
# CLAUDE.md for why this isn't layered under disk_access/FAT here).
CONFIG_DISK_ACCESS=y
CONFIG_FLASH=y

# Phase 11 validation: flash_read_jedec_id() (to confirm the real external
# NOR chip's identity) is gated behind this -- nrf_qspi_nor.c's
# read_jedec_id API entry only compiles in with CONFIG_FLASH_JESD216_API=y.
CONFIG_FLASH_JESD216_API=y

# Maps-feasibility step 1 (docs/maps_feasibility.md): FAT filesystem on the
# SD card, not just raw disk_access sectors. CONFIG_FS_FATFS_MOUNT_MKFS
# (Kconfig default y) means fs_mount() auto-formats a card with no
# existing FAT filesystem instead of just failing.
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# sd_format.c's deliberate "FORMAT SD" command calls fs_mkfs() directly
# (distinct from the CONFIG_FS_FATFS_MOUNT_MKFS auto-format-on-invalid-
# boot-sector behavior above) -- fs_mkfs() itself is gated behind this
# separate Kconfig, off by default.
CONFIG_FILE_SYSTEM_MKFS=y

# Long filenames: 8.3-only tripped up the first version of this test (see
# CLAUDE.md -- fs_open() on an 11-char name failed with FR_INVALID_NAME,
# translated to -ENOENT, not an obvious length error). Future map-tile
# filenames don't need to be 8.3-constrained now. Default LFN mode (BSS,
# static working buffer) is fine -- this app has no concurrent FS access
# from multiple threads yet, so the "not thread-safe" caveat doesn't apply.
CONFIG_FS_FATFS_LFN=y

# Phase 5: BLE central (Cycling Power Service client), no pairing/bonding
# needed -- cycling power meters are normally open GATT servers.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
# 2 filters now: Cycling Power Service (bt_cp_client) and Heart Rate Service
# (bt_hrs_client, below) -- was 1 when only CPS existed.
CONFIG_BT_SCAN_UUID_CNT=2
CONFIG_BT_GATT_DM=y
CONFIG_BT_DEVICE_NAME="stravaV11"

# Heart Rate Service client: unlike Cycling Power (no ready-made NCS
# library, hence the hand-written bt_cp_client), NCS ships bt_hrs_client
# directly (nrf/subsys/bluetooth/services/hrs_client.c) -- modeled on the
# exact same nrf/samples/bluetooth/central_and_peripheral_hrs sample
# bt_cp_client itself followed, so no porting needed here at all, just
# enabling and wiring up in ble_demo.c. Validates the real HRM strap's BLE
# side (it broadcasts both ANT+ and BLE) alongside hrm_demo.c's ANT+ path.
CONFIG_BT_HRS_CLIENT=y

# MCUmgr/SMP over BLE: a real DFU update cycle (MCUboot itself has booted the
# signed app correctly since Phase 10, but no actual over-the-air update was
# ever attempted until now). Following the closest upstream reference,
# zephyr/samples/subsys/mgmt/mcumgr/smp_svr's prj.conf + its overlay-bt.conf,
# trimmed to just the core img/os groups this port's smp_demo.c actually
# needs (that sample's overlay-bt.conf also enables a shell transport,
# LittleFS, stats, and a storage-erase command none of which are wanted
# here). CONFIG_BT_PERIPHERAL is new -- this device has been BLE-central-only
# since Phase 5 (scanning for CP/HRS peripherals); MCUmgr's BT transport
# needs the peripheral role too (advertise + accept an inbound connection
# from the mcumgr host), which is why ble_demo.c's connected() callback
# needed a role check added (see its own comment) -- without it, an inbound
# SMP client connection would have wrongly run the central-role GATT
# discovery-manager logic meant for OUR OWN outbound connections to CP/HRS
# peripherals.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# Found on real hardware: without this, an actual image upload (large,
# multi-fragment SMP requests, unlike the tiny echo/image-list requests
# that worked fine without it) never got a response from the firmware.
# smp_svr's overlay-bt.conf enables this by default; trimmed out of this
# port's initial minimal subset, which was wrong -- upload needs it.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# Found on real hardware: even with smp_demo.c's BT_LE_ADV_OPT_USE_IDENTITY,
# bt_le_adv_start() still failed with -EACCES (err -13) while the existing
# central-role scan (ble_demo.c) was active. Root cause, traced into
# zephyr/subsys/bluetooth/host/id.c: with CONFIG_BT_PRIVACY off (this
# project's default) and this symbol unset, Zephyr's own bt_id_set_scan_own_addr()
# has the scanner generate and use an ephemeral NRPA, not the device's
# identity address -- so when the advertiser (asking for the identity
# address via USE_IDENTITY) tries to set the random address, it doesn't
# match the scanner's currently-set NRPA, and the Bluetooth Core Spec
# forbids the "LE Set Random Address" HCI command entirely while scanning
# is active (Vol 4, Part E 7.8.4), regardless of the value being set.
# Making the scanner ALSO use the identity address means both roles want
# the exact same value, so whichever starts second hits Zephyr's own
# already-set-to-this-value early return instead of issuing that HCI
# command at all -- no actual identity/privacy trade-off for this project,
# since CONFIG_BT_PRIVACY was already off.
CONFIG_BT_SCAN_WITH_IDENTITY=y

# Lezyne feature (2026-09-11, see CLAUDE.md/todo.md): a THIRD concurrent BLE
# role -- peripheral, advertising as "LE GPS 12" (not CONFIG_BT_DEVICE_NAME)
# so the real Lezyne "GPS Ally" phone app can find it. lezyne_ble.c defines
# its own hand-rolled GATT service using the REAL Lezyne service/
# characteristic UUIDs (decompiled from the real GPS Ally app -- see
# Lezyne_app.md/LezyneCycleComputerDevice.txt at the repo root) instead of
# Zephyr's canned NUS service; an earlier version used NUS as an unverified
# guess at the real transport, and GPS Ally's own onServicesDiscovered()
# disconnects immediately if it doesn't find that exact service UUID, so
# CONFIG_BT_NUS is no longer needed here. lezyne_ble.c owns the device's
# one shared legacy advertiser (folded in smp_demo.c's own advertising
# too, see that file's comment -- a first version tried a second,
# independent CONFIG_BT_EXT_ADV advertising set instead, which measurably
# overflowed this board's thin flash partition margin on real hardware).
# CONFIG_BT_MAX_CONN bumped from the default 1 to 2: one central connection
# (ble_demo.c, to a CP/HRS sensor) and one peripheral connection (this
# file's shared advertiser -- either a Lezyne phone or an mcumgr/SMP DFU
# host, never both at once since there's only one inbound peripheral
# connection tracked).
CONFIG_BT_MAX_CONN=2

# Found on real hardware (2026-09-11): a real GPS Ally connection sent a
# RequestFitFileList command right after connecting, and the board
# stack-overflowed and halted (ZEPHYR FATAL ERROR 2, MPU FAULT) about a
# second later -- lezyne_handler.c's handle_file_list() (fs_mount +
# fs_opendir/fs_readdir over FatFS, and handle_file_download_start()/
# handle_file_delete() do similar work) runs synchronously inside
# lez_write_rx()'s GATT write callback, which Zephyr's own docs call out
# as running "in the context of" CONFIG_BT_RX_STACK_SIZE's thread --
# its default of 1200 bytes is nowhere near enough for FatFS traversal
# plus this file's own locals (handle_file_list()'s struct list_ctx
# alone is a 512-byte array) plus the underlying SD/SPI driver's own
# stack use. Bumped well past the default, matching this file's own
# CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608 (a comparable
# "does real I/O from inside a callback" concern) rather than trimming
# lezyne_handler.c to defer this work elsewhere.
CONFIG_BT_RX_STACK_SIZE=4096

# Phase 5: ANT+ combined with the above BLE config -- the documented
# multiprotocol path (nrf/samples equivalent: ant/samples/ble_ant_app_hrm).
# Both sit on MPSL; whichever of ant_init()/bt_enable() runs first brings
# MPSL up for the other, matching that sample's init order (ant_init()
# before bt_enable() in main.c) -- no CONFIG_ANT_SDC_INIT needed.
CONFIG_ANT=y
CONFIG_ANT_CHANNEL_CONFIG=y

# Fallback only: the public non-commercial evaluation license key. When the
# repo-root ANT_license.h (gitignored) is present, CMakeLists.txt overrides
# CONFIG_ANT_LICENSE_KEY with the real key from it via EXTRA_CONF_FILE, which
# takes precedence over this default.
CONFIG_ANT_EVALUATION_KEY=y

# hrm_demo/bsc_demo: real ANT+ device profiles (as opposed to ant_demo.c's
# wildcard channel, which only proves the stack/radio work). ant_plus_key_set()
# (from ANT_KEY_MANAGER) is what actually programs the ANT+ Network Key --
# ant_demo.c's wildcard channel doesn't need it since it isn't profile-keyed.
CONFIG_ANT_HRM=y
CONFIG_ANT_BSC=y
CONFIG_ANT_KEY_MANAGER=y

# ant_dm_demo.c: the ANT+ device manager's background-scan channel needs
# ant_search_config.h/ant_search_init() (ANT_SEARCH_CONFIG) -- not pulled in
# by CONFIG_ANT_HRM/CONFIG_ANT_BSC's own Kconfig deps, since neither of
# those profiles' own channels use a real search-timeout configuration.
CONFIG_ANT_SEARCH_CONFIG=y

# Phase 7: UI graphics (Adafruit_GFX ported to draw into ZephyrGFX's buffer,
# pushed via display_write()). No STL containers used here, but the TDD
# wrapper headers it drags in (segger_wrapper_tdd.h) need <cstdio>, which
# Zephyr's minimal C++ lib (-nostdinc++) doesn't provide -- same fix as
# stravaV11_app.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Phase 8: task_manager -> Zephyr threads + k_event replacement.
CONFIG_EVENTS=y

# WS2812 status LED (stravaV10's drivers/drv_ws2812.c + notifications.c,
# see the board devicetree's spi3/ws2812 nodes for why this is SPI-backed
# rather than PWM -- Zephyr has no PWM WS2812 driver).
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# Phase 9: USB CDC-ACM (new USB device stack). Doesn't touch the existing
# UART console (still the J-Link VCOM) -- this is a second, independent
# serial port over the DK's own USB peripheral.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# USB Mass Storage: exposes the SD card (disk_access name "SD", already
# validated by sd_fat_demo()/map_screen_demo/sd_stress_demo) as a normal USB
# drive, composited alongside the CDC-ACM port above.
CONFIG_USBD_MSC_CLASS=y
# 2 LUNs: SD (above) and the raw QSPI NOR disk below.
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=2
# Default (512) is smaller than NOR's 4096-byte sector size --
# usbd_msc_scsi.c's update_disk_info() silently rejects any LUN whose
# sector_size exceeds this (status = -ENOMEM), which every SCSI
# TEST_UNIT_READY/READ_CAPACITY call then reports to the host as "medium
# not present" -- confirmed on real hardware as a real, zero-byte "Raw NOR
# Flash" drive (lsblk: 0B) despite disk_access itself reporting the
# correct 16777216-byte size the whole time. This buffer is shared across
# all LUNs on the one MSC instance (SD's 512-byte sectors fit fine either
# way), so raising it doesn't need a per-LUN config.
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=4096

# QSPI NOR as a second, unformatted MSC LUN (closes the Phase 4 gap --
# raw data, not a filesystem, so no CONFIG_FILE_SYSTEM/FAT layered on top
# unlike the SD card). Needs the "nordic,pm-ext-flash" chosen entry +
# pm_static_<board>.yml partition (region: external_flash, affiliation:
# disk) -- see boards/*/*.dts|overlay and pm_static_*.yml for the full
# story of why both pieces are required together.
CONFIG_DISK_DRIVER_FLASH=y

# LS0XX driver software-VCOM thread priority is fine at its Kconfig default.
