# Phase 2: DK driver bring-up. GPIO is on by default; this app also needs:
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_LOG=y

# Phase 3: sensors (bme280, fxos8700) and FRAM-equivalent settings storage.
CONFIG_SENSOR=y
CONFIG_EEPROM=y

# Phase 4: storage. SD-over-SPI disk_access (no card present, see overlay)
# and the DK's real on-board QSPI NOR flash via the direct flash API (see
# CLAUDE.md for why this isn't layered under disk_access/FAT here).
CONFIG_DISK_ACCESS=y
CONFIG_FLASH=y

# LS0XX driver software-VCOM thread priority is fine at its Kconfig default.
