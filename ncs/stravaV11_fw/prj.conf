# Phase 2: DK driver bring-up. GPIO is on by default; this app also needs:
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_LOG=y

# Phase 3: sensors (bme280, fxos8700) and FRAM-equivalent settings storage.
CONFIG_SENSOR=y
CONFIG_EEPROM=y

# Phase 4: storage. SD-over-SPI disk_access (no card present, see overlay)
# and the DK's real on-board QSPI NOR flash via the direct flash API (see
# CLAUDE.md for why this isn't layered under disk_access/FAT here).
CONFIG_DISK_ACCESS=y
CONFIG_FLASH=y

# Phase 5: BLE central (Cycling Power Service client), no pairing/bonding
# needed -- cycling power meters are normally open GATT servers.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_DM=y
CONFIG_BT_DEVICE_NAME="stravaV11"

# Phase 5: ANT+ combined with the above BLE config -- the documented
# multiprotocol path (nrf/samples equivalent: ant/samples/ble_ant_app_hrm).
# Both sit on MPSL; whichever of ant_init()/bt_enable() runs first brings
# MPSL up for the other, matching that sample's init order (ant_init()
# before bt_enable() in main.c) -- no CONFIG_ANT_SDC_INIT needed.
CONFIG_ANT=y
CONFIG_ANT_CHANNEL_CONFIG=y
CONFIG_ANT_EVALUATION_KEY=y

# Phase 7: UI graphics (Adafruit_GFX ported to draw into ZephyrGFX's buffer,
# pushed via display_write()). No STL containers used here, but the TDD
# wrapper headers it drags in (segger_wrapper_tdd.h) need <cstdio>, which
# Zephyr's minimal C++ lib (-nostdinc++) doesn't provide -- same fix as
# stravaV11_app.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# LS0XX driver software-VCOM thread priority is fine at its Kconfig default.
