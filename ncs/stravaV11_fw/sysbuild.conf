# Phase 10: replaces stravaV10's dfu/ (a full nRF5 SDK "secure DFU
# bootloader" -- nrf_bootloader/nrf_dfu, MBR-based, USB-triggered by
# holding a button at power-on) with MCUboot, the standard cross-vendor
# Zephyr/NCS bootloader already checked out in this workspace at
# bootloader/mcuboot.
#
# This is mainline Zephyr's own sysbuild MCUboot integration
# (zephyr/share/sysbuild/images/bootloader/Kconfig), not NCS's older
# Partition Manager-based path -- it uses devicetree fixed-partitions for
# the slot layout, so it doesn't hit the PM/flash-disk affiliation issue
# from Phase 4 (that was specific to disk_access's flashdisk driver, not
# to boot partitioning, which is a different and well-supported PM/DT use
# case either way).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Project-owned signing key, not MCUboot's own upstream sample key
# (bootloader/mcuboot/root-ec-p256.pem, the default this repo built
# against through the first real DFU validation in Phase 10). That
# sample key's *private* half is checked into the public mcuboot repo --
# fine to prove the DFU mechanics work, but it means anyone could sign an
# image this board's MCUboot would accept as genuine. Generated once via:
#   python3 bootloader/mcuboot/scripts/imgtool.py keygen \
#     -k /home/vincent/Github/StravaV11/mcuboot_signing_key.pem -t ecdsa-p256
# Gitignored at the repo root -- see .gitignore's comment there and
# COMMANDS.md's "Signing key" section for regeneration/rotation notes.
# BOOT_SIGNATURE_TYPE defaults to ECDSA_P256 already (matches this key).
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/home/vincent/Github/StravaV11/mcuboot_signing_key.pem"
