CONFIG_ANT=y
CONFIG_ANT_CHANNEL_CONFIG=y

# ant/Kconfig's ANT_LIB_DIR is patched locally to also match
# SOC_SERIES_NRF52 (see that file) -- sdk-ant 2.1.1 only checks the
# deprecated SOC_SERIES_NRF52X, a version-skew break against our NCS
# v3.3.4. ANT_LIB_DIR has no Kconfig prompt so it can't be overridden
# from here directly (Zephyr's Kconfig rejects that outright).

# Evaluation key: this is a hobby project, not a commercial ANT+ product, so
# no commercial license key. See ant/init/Kconfig for what this actually
# gates -- it's the intended non-commercial-use setting, not a shortcut.
CONFIG_ANT_EVALUATION_KEY=y

CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
